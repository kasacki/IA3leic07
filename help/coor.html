<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuvin Axial Coordinate Tool (Radius 3)</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #D2B48C; /* Tan, matching GUI.py */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        svg {
            border: 1px solid black;
            background-color: white; /* Clean background for SVG */
        }

        .hex {
            fill: #fdfdfd;
            stroke: #000;
            stroke-width: 1;
            transition: fill 0.1s;
        }

        .hex:hover {
            fill: #D2B48C !important; /* Tan highlight on hover */
            cursor: pointer;
        }

        #coord-popup {
            position: absolute;
            background: black;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            pointer-events: none; /* Mouse can pass through it */
            display: none;
            font-weight: bold;
        }
    }
    </style>
</head>
<body>

    <svg id="hex-grid" width="600" height="500"></svg>
    <div id="coord-popup"></div>

    <script>
        const radius = 3; // Game radius (37 hexes)
        const size = 35; // Size of hexagon side (matching gui.py)
        const svg = document.getElementById('hex-grid');
        const popup = document.getElementById('coord-popup');

        // Math for Pointy-Topped hexagons
        function hexToPixel(q, r) {
            const x = size * (Math.sqrt(3) * q + Math.sqrt(3)/2 * r) + 300;
            const y = size * (3/2 * r) + 250;
            return { x, y };
        }

        function createHexagon(q, r) {
            const { x, y } = hexToPixel(q, r);
            const points = [];
            for (let i = 0; i < 6; i++) {
                const angle = (60 * i - 30) * Math.PI / 180;
                points.push(`${x + size * Math.cos(angle)},${y + size * Math.sin(angle)}`);
            }

            // Create SVG polygon
            const poly = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
            poly.setAttribute("points", points.join(' '));
            poly.setAttribute("class", "hex");
            
            // Assign coordinate data for interactions
            poly.dataset.q = q;
            poly.dataset.r = r;

            // Optional: Draw initial starting piece colors (to match startup screen)
            // Player 1 (Black, formerly Blue): Bottom Right Cluster
            const p1 = [[1, 2], [2, 1], [3, 0], [2, 0], [1, 1], [0, 2]];
            const isP1 = p1.some(c => c[0] === q && c[1] === r);
            if (isP1) {
                poly.style.fill = "#333"; // Dark gray to represent black
            }

            // Add interactivity
            poly.addEventListener('mouseenter', showCoords);
            poly.addEventListener('mousemove', movePopup);
            poly.addEventListener('mouseleave', hideCoords);

            return poly;
        }

        // --- Interaction Logic ---
        function showCoords(event) {
            const q = event.target.dataset.q;
            const r = event.target.dataset.r;
            popup.innerText = `(${q}, ${r})`;
            popup.style.display = "block";
        }

        function movePopup(event) {
            popup.style.left = (event.pageX + 10) + "px";
            popup.style.top = (event.pageY + 10) + "px";
        }

        function hideCoords() {
            popup.style.display = "none";
        }

        // --- Grid Generation ---
        // Generate coordinates that satisfy |q| <= 3, |r| <= 3, and |q+r| <= 3
        for (let q = -radius; q <= radius; q++) {
            for (let r = -radius; r <= radius; r++) {
                if (Math.abs(q) <= radius && Math.abs(r) <= radius && Math.abs(q + r) <= radius) {
                    svg.appendChild(createHexagon(q, r));
                }
            }
        }

    </script>
</body>
</html>
